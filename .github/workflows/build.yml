name: Build and Publish Extension

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build the .cs3 plugin and generate plugins.json
      - name: Build plugin
        run: ./gradlew make makePluginsJson

      - name: Prepare GitHub Pages output
        run: |
          mkdir -p public
          # Copy the generated plugin list + the compiled .cs3 artifacts
          cp build/plugins.json public/plugins.json
          cp -r */build/*.cs3 public/ 2>/dev/null || true
          find . -name '*.cs3' -exec cp {} public/ \;

          # Rewrite the .cs3 urls inside plugins.json to point at GitHub Pages
          BASE="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY##*/}"
          node -e '
            const fs=require("fs");
            const base=process.env.BASE;
            const p=JSON.parse(fs.readFileSync("public/plugins.json","utf8"));
            for(const k in p){
              const e=p[k];
              if(e.url) e.url=`${base}/${e.url.split("/").pop()}`;
            }
            fs.writeFileSync("public/plugins.json",JSON.stringify(p,null,2));
            const repo={
              "name":"Indflix",
              "description":"CloudStream extension that scrapes Multimovies and pulls sources in parallel with a per-source timeout.",
              "manifestVersion":1,
              "pluginLists":[`${base}/plugins.json`]
            };
            fs.writeFileSync("public/repo.json",JSON.stringify(repo,null,2));
          '
        env:
          BASE: "https://${{ github.repository_owner }}.github.io/${{ github.repository }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

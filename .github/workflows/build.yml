name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace --no-daemon 2>&1 | tee $GITHUB_WORKSPACE/builds/build.log
          echo "=== locate *.cs3 ===" >> $GITHUB_WORKSPACE/builds/locate.log
          find $GITHUB_WORKSPACE/src -name '*.cs3' >> $GITHUB_WORKSPACE/builds/locate.log 2>&1 || true
          find $GITHUB_WORKSPACE/src -name '*.cs3' -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          echo "=== locate plugins.json ===" >> $GITHUB_WORKSPACE/builds/locate.log
          find $GITHUB_WORKSPACE/src -name 'plugins.json' >> $GITHUB_WORKSPACE/builds/locate.log 2>&1 || true
          find $GITHUB_WORKSPACE/src -name 'plugins.json' -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          cp $GITHUB_WORKSPACE/src/repo.json $GITHUB_WORKSPACE/builds/repo.json
          echo "=== builds dir ==="
          ls -la $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if [[ -n $(git status -s) ]]; then
            git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA"
            git push --force
          else
            echo "No changes to push"
          fi

      - name: Capture build error
        if: failure()
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add build.log
          git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA"
          git push --force || true
